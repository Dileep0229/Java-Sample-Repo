apiVersion: apps/v1
kind: Deployment
metadata:
 name: hello-app
spec:
 replicas: 3
 selector:
 matchLabels:
 app: hello-app
 template:
 metadata:
 labels:
 app: hello-app
 spec:
 containers:
 - name: hello-app
 image: dileep0229/getting-started:latest
 ports:
 - containerPort: 8080
 env:
 - name: SPRING_DATASOURCE_URL
 value: jdbc:postgresql://postgres-db:5432/hello_db
 - name: SPRING_DATASOURCE_USERNAME
 value: hello_user
 - name: SPRING_DATASOURCE_PASSWORD
 value: hello_pass
